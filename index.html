<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Exibe o site corretamente de acordo com o dispositivo do usuário -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Componente de código QR</title>

  <!-- Fique à vontade para remover estes estilos ou personalizá-los em sua própria folha de estilos 👍 -->
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap">
  <style>
    .qr-code { width: 100%; max-width: 15rem; margin-bottom: 1.5rem;} /*utilizado para definir a largura máxima da imagem dentro do cartão*/
    .card { background-color:hsl(0, 0%, 100%) ; border-radius: 1rem; box-shadow: 0px 10px 20px hsla(212, 45%, 89%, 0.5); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 1.5rem; max-width: 15rem; margin: 2rem auto; } /*utilizado para definir a cor de fundo do cartão, arredondar os cantos, adicionar sombra, definir o layout como flexbox, alinhar itens ao centro, adicionar espaçamento interno e definir tamanho do cartão*/
    body { background-color: hsl(212, 45%, 89%); font-family: 'Outfit', sans-serif;  display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; } /*utilizado para definir a cor de fundo do corpo, a família de fontes, o layout como flexbox, centralizar o conteúdo vertical e horizontalmente, definir a altura da tela e remover a margem padrão*/
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 0.5rem; color: hsl(218, 44%, 22%); }
    p { font-size: 15px; color: hsl(216, 15%, 48%); }
  </style>
</head>
<body>
  <div class="card">
<img src="./images/image-qr-code.png" alt="Código QR" class="qr-code">
  <h1>Aprimore suas habilidades de desenvolvimento front-end criando projetos</h1>

  <p>Escaneie o código QR para visitar o Frontend Mentor e levar suas habilidades de programação ao próximo nível</p>
  
  </div>
  <footer class="attribution">
    Desafio proposto pelo <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Desenvolvido por <a href="#">Felipe Valaião de Oliveira</a>.
  </footer>
</body>
</html>
